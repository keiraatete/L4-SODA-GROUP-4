<!DOCTYPE html>
<html>
<head>
<title>iChat Pro</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="chat-container">
  <div class="header">iChat Pro</div>

  <div id="onlineUsers" class="online-users"></div>

  <div id="chatBox" class="chat-box"></div>
  <div id="typing" class="typing"></div>
  <div id="replyPreview" class="reply-preview" hidden></div>

  <input id="input" placeholder="Type message..." oninput="notifyTyping()">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/script.js"></script>

</body>
</html>
